name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows GUI Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install build dependencies
        run: |
          uv venv --python 3.12
          uv pip install PyQt6 psutil pyinstaller

      - name: Build Windows GUI exe (no console)
        run: |
          .\.venv\Scripts\pyinstaller.exe `
            --noconfirm `
            --onefile `
            --windowed `
            --name gpu-sentry-windows-x64 `
            --icon assets/gpu_sentry.ico `
            --add-data "assets;assets" `
            --collect-submodules core `
            --collect-submodules ui `
            main.py

      - name: Package Windows zip
        run: |
          Compress-Archive -Path dist/gpu-sentry-windows-x64.exe -DestinationPath dist/gpu-sentry-windows-x64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/gpu-sentry-windows-x64.exe
            dist/gpu-sentry-windows-x64.zip

  build-linux:
    name: Build Standalone Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system Qt6/X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxkbcommon0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install build dependencies
        run: |
          uv venv --python 3.12
          uv pip install PyQt6 psutil pyinstaller

      - name: Build Linux standalone binary
        run: |
          .venv/bin/pyinstaller \
            --noconfirm \
            --onefile \
            --name gpu-sentry-linux-x64 \
            --add-data "assets:assets" \
            --collect-submodules core \
            --collect-submodules ui \
            main.py
          tar -czf dist/gpu-sentry-linux-x64.tar.gz -C dist gpu-sentry-linux-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/gpu-sentry-linux-x64
            dist/gpu-sentry-linux-x64.tar.gz

  build-python-dist:
    name: Build Python Wheel & Sdist (Windows / Linux / uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-python-dist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
